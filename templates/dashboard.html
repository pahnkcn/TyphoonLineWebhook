<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>แดชบอร์ดวิจัย — ใจดี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--gradient-start:#4c1d95;--gradient-end:#1e3a8a;--surface:rgba(255,255,255,.92);--surface-strong:rgba(255,255,255,.98);--border:rgba(148,163,184,.28);--border-strong:rgba(148,163,184,.45);--text-primary:#0f172a;--text-muted:#64748b;--accent:#6366f1;--accent-soft:rgba(99,102,241,.16);--shadow-lg:0 20px 50px -20px rgba(15,23,42,.4);--bg-gradient:linear-gradient(180deg,#eef2ff 0%,#f8fafc 100%);--card-bg:rgba(255,255,255,.7)}
    [data-theme="dark"]{color-scheme:dark;--gradient-start:#1e1b4b;--gradient-end:#0f172a;--surface:rgba(30,41,59,.92);--surface-strong:rgba(30,41,59,.98);--border:rgba(71,85,105,.35);--border-strong:rgba(71,85,105,.55);--text-primary:#f1f5f9;--text-muted:#94a3b8;--accent:#818cf8;--accent-soft:rgba(129,140,248,.2);--shadow-lg:0 20px 50px -20px rgba(0,0,0,.6);--bg-gradient:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);--card-bg:rgba(30,41,59,.7)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:'Prompt','Segoe UI',sans-serif;background:var(--bg-gradient);color:var(--text-primary);line-height:1.55;transition:background .3s,color .3s}
    body.modal-open{overflow:hidden}
    h1,h2,h3,h4{margin:0;font-weight:600}
    p{margin:0}
    button{font-family:inherit;border:none;background:none;cursor:pointer}
    select,input{font-family:inherit}
    .shell{display:flex;flex-direction:column;min-height:100vh}
    .hero{position:relative;padding:48px 0 90px;background:radial-gradient(circle at top left,rgba(116,95,255,.78),rgba(76,29,149,.9)),linear-gradient(135deg,var(--gradient-start),var(--gradient-end));color:#f8fafc;overflow:hidden}
    .hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18),transparent 55%);mix-blend-mode:screen;pointer-events:none}
    .wrap{position:relative;z-index:1;width:min(1280px,94vw);margin:0 auto}
    .hero .wrap{display:flex;flex-direction:column;gap:16px}
    .hero h1{font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.02em}
    .hero p{margin-top:8px;color:rgba(248,250,252,.85)}
    .hero-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:500;font-size:.85rem;transition:all .3s}
    .chip.ok{background:rgba(34,197,94,.15);color:#bbf7d0}
    .chip.err{background:rgba(248,113,113,.22);color:#fee2e2}
    .chip.load{background:rgba(124,58,237,.22);color:#ede9fe}
    .theme-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#f8fafc;font-size:.85rem;font-weight:500;transition:all .3s}
    .theme-btn:hover{background:rgba(255,255,255,.22)}
    .eyebrow{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
    .main{flex:1;margin:-52px auto 48px;display:flex;flex-direction:column;gap:24px}
    .card{background:var(--surface);border-radius:22px;border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:24px;backdrop-filter:blur(16px)}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
    select{border-radius:12px;border:1px solid var(--border-strong);padding:9px 14px;font-size:.95rem;background:var(--surface-strong);color:var(--text-primary)}
    select:focus{outline:none;border-color:rgba(99,102,241,.8);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
    .filter-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:16px}
    .field{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
    .field span{color:var(--text-muted);font-weight:500}
    .field input{border-radius:12px;border:1px solid var(--border-strong);padding:9px 14px;font-size:.95rem;background:var(--surface-strong);color:var(--text-primary)}
    .field input:focus{outline:none;border-color:rgba(99,102,241,.8);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
    .panel{margin-top:16px;padding:16px;border-radius:18px;border:1px solid rgba(148,163,184,.2);background:var(--card-bg)}
    .panel-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
    .action-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .helper{font-size:.82rem;color:var(--text-muted)}
    .checkline{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text-muted);padding-top:28px}
    .checkline input{width:auto;padding:0;margin:0}
    .ghost-btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;border:1px solid rgba(248,250,252,.35);color:inherit;background:rgba(255,255,255,.12);font-weight:500;font-size:.9rem;transition:all .2s}
    .ghost-btn:hover:not(:disabled){background:rgba(255,255,255,.22)}
    .ghost-btn:disabled{opacity:.6;cursor:progress}
    .primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:.9rem;transition:transform .2s,box-shadow .2s}
    .primary-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(99,102,241,.6)}

    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .stat{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--card-bg);border:1px solid rgba(148,163,184,.2);border-radius:18px;padding:16px;transition:all .3s}
    [data-theme="dark"] .stat{background:rgba(30,41,59,.5);border-color:rgba(71,85,105,.4)}
    .stat:hover{transform:translateY(-2px);box-shadow:0 12px 28px -16px rgba(99,102,241,.4)}
    .stat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
    .stat-body{display:flex;flex-direction:column;gap:2px}
    .stat-lbl{font-size:.8rem;color:var(--text-muted);font-weight:500}
    .stat-val{font-size:1.35rem;font-weight:600}
    .stat-hint{font-size:.75rem;color:var(--text-muted)}

    /* Tabs */
    .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
    .tab{padding:9px 18px;border-radius:12px;font-size:.88rem;font-weight:500;color:var(--text-muted);transition:all .2s;white-space:nowrap}
    .tab:hover{color:var(--text-primary);background:var(--accent-soft)}
    .tab.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px -4px rgba(99,102,241,.45)}

    /* Viz area */
    .viz{min-height:460px}
    .viz-canvas{position:relative;width:100%;height:400px}
    .viz-canvas canvas{width:100%!important;height:100%!important}
    .viz-desc{margin-top:14px;padding:14px 18px;background:var(--accent-soft);border-radius:14px;font-size:.88rem;color:var(--text-muted);line-height:1.7}
    .viz-desc strong{color:var(--text-primary)}
    .viz-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
    .vm{background:var(--card-bg);border:1px solid rgba(148,163,184,.2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
    [data-theme="dark"] .vm{background:rgba(30,41,59,.5)}
    .vm span{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
    .vm strong{font-size:1.05rem}
    .donut-wrap{position:relative;display:grid;place-items:center}
    .donut-center{position:absolute;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--text-muted)}
    .donut-center strong{font-size:1.5rem;font-weight:600;color:var(--text-primary)}
    .risk-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
    .legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
    .legend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:.88rem;color:var(--text-muted)}
    .legend-dot{width:10px;height:10px;border-radius:999px}
    .legend-lbl{font-weight:600;color:var(--text-primary)}
    .legend-val{font-weight:600;color:var(--text-primary)}
    .keyword-grid{display:flex;flex-wrap:wrap;gap:10px}
    .kw{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;border:1px solid rgba(99,102,241,.16);background:rgba(99,102,241,.08);min-width:160px;transition:transform .2s}
    .kw:hover{transform:translateY(-2px)}
    .kw-term{font-weight:600;color:var(--text-primary)}
    .kw-meta{font-size:.8rem;color:var(--text-muted)}
    .kw.r-high{border-color:rgba(239,68,68,.2);background:rgba(239,68,68,.08)}
    .kw.r-medium{border-color:rgba(249,115,22,.2);background:rgba(249,115,22,.08)}
    .kw.r-general{border-color:rgba(34,197,94,.2);background:rgba(34,197,94,.08)}
    .kw.r-contextual{border-color:rgba(14,165,233,.2);background:rgba(14,165,233,.08)}

    /* User table */
    .u-table{display:flex;flex-direction:column;gap:10px}
    .u-head{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,.7fr)) minmax(0,1fr);gap:14px;padding:0 16px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600}
    .u-head span{cursor:pointer;display:flex;align-items:center;gap:4px;transition:color .2s}
    .u-head span:hover{color:var(--accent)}
    .u-body{display:flex;flex-direction:column;gap:8px}
    .u-row{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,.7fr)) minmax(0,1fr);gap:14px;align-items:center;border-radius:16px;padding:14px 16px;background:var(--card-bg);border:1px solid rgba(148,163,184,.16);text-align:left;transition:all .2s}
    [data-theme="dark"] .u-row{background:rgba(30,41,59,.5)}
    .u-row:hover{transform:translateY(-2px);border-color:rgba(99,102,241,.35);box-shadow:0 12px 28px -16px rgba(99,102,241,.4)}
    .u-entry{display:flex;align-items:center;gap:12px;min-width:0}
    .u-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(99,102,241,.85),rgba(59,130,246,.9));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:.9rem;flex-shrink:0}
    .u-info{display:flex;flex-direction:column;gap:2px;min-width:0}
    .u-info strong{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .u-id{font-size:.72rem;color:var(--text-muted)}
    .u-stat{font-weight:600;font-variant-numeric:tabular-nums}
    .u-meta{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:.8rem;color:var(--text-muted)}
    .r-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:.72rem;font-weight:600}
    .r-chip.high{background:rgba(239,68,68,.12);color:#b91c1c}
    .r-chip.medium{background:rgba(249,115,22,.12);color:#c2410c}
    .r-chip.general{background:rgba(34,197,94,.12);color:#15803d}
    .r-chip.unknown{background:rgba(148,163,184,.16);color:#475569}
    [data-theme="dark"] .r-chip.high{background:rgba(239,68,68,.2);color:#fca5a5}
    [data-theme="dark"] .r-chip.medium{background:rgba(249,115,22,.2);color:#fdba74}
    [data-theme="dark"] .r-chip.general{background:rgba(34,197,94,.2);color:#86efac}
    .empty{padding:24px;border-radius:16px;border:1px dashed rgba(148,163,184,.4);background:rgba(248,250,252,.7);text-align:center;color:var(--text-muted);font-size:.9rem}
    [data-theme="dark"] .empty{background:rgba(15,23,42,.5)}
    .search-box{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface-strong);transition:all .2s;margin-bottom:12px}
    .search-box:focus-within{border-color:rgba(99,102,241,.8);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
    .search-box input{flex:1;border:none;padding:0;background:transparent;color:var(--text-primary);font-size:.95rem}
    .search-box input:focus{outline:none;box-shadow:none}

    /* Modal */
    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.52);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:40;overflow-y:auto;animation:fadeIn .2s}
    [data-theme="dark"] .modal-bg{background:rgba(0,0,0,.7)}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{background:var(--surface-strong);border-radius:28px;width:min(960px,100%);box-shadow:0 40px 80px -30px rgba(15,23,42,.5);border:1px solid var(--border);display:flex;flex-direction:column;max-height:calc(100vh - 120px);overflow:hidden;animation:slideUp .3s}
    @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-top{display:flex;justify-content:space-between;align-items:flex-start;padding:28px 28px 0;gap:12px}
    .modal-sub{margin-top:4px;color:var(--text-muted);font-size:.85rem}
    .modal-body{padding:20px 28px 28px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
    .modal-section h4{font-size:1.05rem;margin-bottom:12px}
    .modal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;background:var(--accent-soft);border-radius:18px;padding:16px}
    .modal-grid div{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--text-muted)}
    .modal-grid strong{font-size:1.05rem;color:var(--text-primary)}
    .risk-feed{display:flex;flex-direction:column;gap:10px;max-height:200px;overflow-y:auto}
    .risk-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:1px solid rgba(148,163,184,.2);background:var(--card-bg)}
    [data-theme="dark"] .risk-row{background:rgba(30,41,59,.5)}
    .risk-info{display:flex;flex-direction:column;gap:4px}
    .risk-info strong{font-size:.9rem}
    .timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto}
    .tl-item{border-radius:16px;border:1px solid rgba(148,163,184,.18);background:var(--card-bg);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
    [data-theme="dark"] .tl-item{background:rgba(30,41,59,.5)}
    .tl-item.imp{border-color:rgba(249,115,22,.35);box-shadow:0 12px 28px -20px rgba(249,115,22,.4)}
    .tl-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--text-muted)}
    .tl-msgs p{margin:0;display:flex;gap:6px;font-size:.9rem}
    .tl-lbl{font-weight:600;color:var(--text-muted);min-width:48px}
    .spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
    .spinner.sm{width:12px;height:12px;border-width:2px}
    .spinner.pri{border-color:rgba(99,102,241,.3);border-top-color:var(--accent)}
    .skel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .skel{position:relative;min-height:180px;background:rgba(226,232,240,.35);border-radius:20px;overflow:hidden}
    [data-theme="dark"] .skel{background:rgba(30,41,59,.35)}
    .skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(248,250,252,.6),transparent);animation:shimmer 1.6s infinite}
    [data-theme="dark"] .skel::after{background:linear-gradient(90deg,transparent,rgba(51,65,85,.6),transparent)}
    .error-card{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#b91c1c;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.28)}
    [data-theme="dark"] .error-card{color:#fca5a5;background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4)}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    @media(min-width:900px){.hero .wrap{flex-direction:row;justify-content:space-between;align-items:flex-end}.risk-layout{grid-template-columns:260px 1fr}}
    @media(max-width:720px){.card{padding:18px}.u-head,.u-row{grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,.8fr))}.u-head span:nth-child(4),.u-head span:nth-child(5),.u-row span:nth-child(4),.u-row span:nth-child(5){display:none}.risk-layout{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media print{.ghost-btn,.primary-btn,.theme-btn,.tabs{display:none!important}.card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}}
  </style>
</head>

  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script>window.__DASHBOARD_BOOT__ = {{ {'authRequired': dashboard_auth_required}|tojson }};</script>
  {% raw %}
  <script>
(()=>{
const{useState,useEffect,useMemo,useCallback,useRef}=React;
const html=htm.bind(React.createElement);
const numFmt=new Intl.NumberFormat('th-TH');
const pctFmt=new Intl.NumberFormat('th-TH',{style:'percent',maximumFractionDigits:1,minimumFractionDigits:1});
const shortDate=new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short'});
const fullDT=new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short',hour12:false});
const decCache={};
const riskMeta={high:{label:'ระดับสูง',color:'#ef4444'},medium:{label:'ระวัง',color:'#f97316'},general:{label:'ทั่วไป',color:'#22c55e'},contextual:{label:'บริบท',color:'#0ea5e9'},unknown:{label:'ไม่ระบุ',color:'#94a3b8'}};
const lookbackOpts=[7,14,30,60,90,180];
const userLimitOpts=[5,10,15,20,30];
const kwLimitOpts=[5,10,15,20,30];
const boot=window.__DASHBOARD_BOOT__||{authRequired:false};
const AUTH_TOKEN_KEY='dashboard-api-token';

function fmtN(v){const n=Number(v);return Number.isFinite(n)?numFmt.format(n):'--'}
function fmtD(v,d=1){const n=Number(v);if(!Number.isFinite(n))return'--';if(!decCache[d])decCache[d]=new Intl.NumberFormat('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});return decCache[d].format(n)}
function fmtP(r){const n=Number(r);return Number.isFinite(n)?pctFmt.format(Math.max(n,0)):'--'}
function toDate(v){if(!v)return null;const d=new Date(v);return isNaN(d.getTime())?null:d}
function fmtDT(v){const d=toDate(v);return d?fullDT.format(d):'-'}
function fmtRange(a,b){const s=toDate(a),e=toDate(b);if(!s&&!e)return'-';return(s?shortDate.format(s):'-')+' â€“ '+(e?shortDate.format(e):'-')}

function readStoredToken(){try{return sessionStorage.getItem(AUTH_TOKEN_KEY)||''}catch{return''}}
function persistToken(token){try{if(token)sessionStorage.setItem(AUTH_TOKEN_KEY,token);else sessionStorage.removeItem(AUTH_TOKEN_KEY)}catch{}}
function toInputDate(value){const d=value?new Date(value):new Date();if(isNaN(d.getTime()))return'';const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}
function daysAgoInput(days){const d=new Date();d.setDate(d.getDate()-Math.max(days,0));return toInputDate(d)}
function getDownloadFilename(disposition,fallback){const match=/filename="?([^";]+)"?/i.exec(disposition||'');return match?match[1]:fallback}
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function Spin({sm,pri}){return html`<span className=${'spinner'+(sm?' sm':'')+(pri?' pri':'')} />`}
function getInitials(v){if(!v)return'--';const p=String(v).trim().split(/\s+/);if(p.length>=2)return (p[0][0]+p[1][0]).toUpperCase();return String(v).slice(0,2).toUpperCase()}

/* ===== Chart helper: isDark ===== */
function isDark(){return document.documentElement.getAttribute('data-theme')==='dark'}
function tipStyle(){const dk=isDark();return{backgroundColor:dk?'rgba(30,41,59,.95)':'rgba(255,255,255,.95)',titleColor:dk?'#f1f5f9':'#0f172a',bodyColor:dk?'#cbd5e1':'#475569',borderColor:dk?'rgba(71,85,105,.5)':'rgba(148,163,184,.3)',borderWidth:1}}
function gridColor(){return isDark()?'rgba(71,85,105,.3)':'rgba(148,163,184,.25)'}
function tickColor(){return isDark()?'#94a3b8':'#64748b'}
function labelColor(){return isDark()?'#cbd5e1':'#475569'}

/* ===== CHART COMPONENTS ===== */

function ChartTrend({entries}){
  const ref=useRef(null),chart=useRef(null);
  const has=Array.isArray(entries)&&entries.length>0;
  useEffect(()=>{
    if(!ref.current||!window.Chart||!has)return;
    if(chart.current)chart.current.destroy();
    const labels=entries.map(e=>{const d=toDate(e.date);return d?shortDate.format(d):e.date||''});
    const totals=entries.map(e=>Number(e.total_messages)||0);
    const shares=entries.map((e,i)=>{const t=totals[i],imp=Number(e.important_messages)||0;return t?(imp/t)*100:0});
    chart.current=new Chart(ref.current.getContext('2d'),{
      type:'line',
      data:{labels,datasets:[
        {label:'ข้อความทั้งหมด',data:totals,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.15)',tension:.3,fill:'origin',pointRadius:3,pointHoverRadius:5},
        {label:'% ข้อความสำคัญ',data:shares.map(v=>+v.toFixed(1)),borderColor:'#f97316',backgroundColor:'rgba(249,115,22,.15)',tension:.3,pointRadius:3,pointHoverRadius:5,yAxisID:'pct',fill:'origin'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        scales:{y:{beginAtZero:true,ticks:{color:tickColor()},grid:{color:gridColor()},title:{display:true,text:'จำนวนข้อความ',color:labelColor()}},
          pct:{position:'right',beginAtZero:true,suggestedMax:100,ticks:{color:tickColor(),callback:v=>v+'%'},grid:{drawOnChartArea:false},title:{display:true,text:'% สำคัญ',color:labelColor()}},
          x:{ticks:{color:tickColor()},grid:{display:false}}},
        plugins:{legend:{display:true,labels:{usePointStyle:true,color:labelColor()}},tooltip:{...tipStyle()}}}
    });
    return()=>{if(chart.current)chart.current.destroy()};
  },[entries]);
  if(!has)return html`<div className="empty">ยังไม่มีข้อมูลแนวโน้ม</div>`;
  const sum=entries.reduce((a,e)=>a+(Number(e.total_messages)||0),0);
  const sumImp=entries.reduce((a,e)=>a+(Number(e.important_messages)||0),0);
  return html`<div>
    <div className="viz-metrics"><div className="vm"><span>ข้อความรวม</span><strong>${fmtN(sum)}</strong></div><div className="vm"><span>สำคัญ</span><strong>${fmtN(sumImp)}</strong></div><div className="vm"><span>สัดส่วน</span><strong>${fmtP(sum?sumImp/sum:0)}</strong></div></div>
    <div className="viz-canvas"><canvas ref=${ref} /></div></div>`;
}

function ChartRiskDist({riskSummary}){
  const ref=useRef(null),chart=useRef(null);
  const entries=Object.entries(riskSummary||{});
  const total=entries.reduce((a,[,v])=>a+(Number(v)||0),0);
  const segs=entries.filter(([k,v])=>['high','medium','general','unknown','contextual'].includes(k)&&Number(v)>0).map(([k,v])=>({key:k,label:riskMeta[k]?.label||k,value:Number(v)||0,color:riskMeta[k]?.color||'#94a3b8'}));
  useEffect(()=>{
    if(!ref.current||!window.Chart||!segs.length)return;
    if(chart.current)chart.current.destroy();
    chart.current=new Chart(ref.current.getContext('2d'),{
      type:'doughnut',
      data:{labels:segs.map(s=>s.label),datasets:[{data:segs.map(s=>s.value),backgroundColor:segs.map(s=>s.color),borderWidth:0,hoverOffset:14}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{...tipStyle(),callbacks:{label(ctx){const sh=total?ctx.parsed/total:0;return ctx.label+': '+fmtN(ctx.parsed)+' • '+fmtP(sh)}}}}}
    });
    return()=>{if(chart.current)chart.current.destroy()};
  },[riskSummary]);
  if(!segs.length)return html`<div className="empty">ยังไม่มีเหตุการณ์ความเสี่ยง</div>`;
  return html`<div className="risk-layout">
    <div className="donut-wrap"><div className="viz-canvas" style=${{height:'300px'}}><canvas ref=${ref} /></div><div className="donut-center"><strong>${fmtN(total)}</strong><span>เหตุการณ์</span></div></div>
    <ul className="legend">${segs.map(s=>{const sh=total?s.value/total:0;return html`<li key=${s.key}><span className="legend-dot" style=${{backgroundColor:s.color}} /><span className="legend-lbl">${s.label}</span><span className="legend-val">${fmtN(s.value)}</span><span style=${{fontSize:'.82rem'}}>${fmtP(sh)}</span></li>`})}</ul>
  </div>`;
}

function ChartRetention({buckets}){
  const ref=useRef(null),chart=useRef(null);
  const has=Array.isArray(buckets)&&buckets.length>0;
  useEffect(()=>{
    if(!ref.current||!window.Chart||!has)return;
    if(chart.current)chart.current.destroy();
    const colors=['#6366f1','#0ea5e9','#22c55e','#facc15','#f97316'];
    chart.current=new Chart(ref.current.getContext('2d'),{
      type:'bar',
      data:{labels:buckets.map(b=>b.bucket+' ข้อความ'),datasets:[{label:'จำนวนผู้ใช้',data:buckets.map(b=>b.user_count),backgroundColor:buckets.map((_,i)=>colors[i%colors.length]),borderRadius:10,borderSkipped:false}]},

    });
    return()=>{if(chart.current)chart.current.destroy()};
  },[buckets]);
  if(!has)return html`<div className="empty">ยังไม่มีข้อมูล Retention</div>`;
  const total=buckets.reduce((a,b)=>a+b.user_count,0);

  return html`<div>

function VizKeywords({keywords}){
  const items=Array.isArray(keywords)?keywords:[];
  if(!items.length)return html`<div className="empty">ยังไม่มีคีย์เวิร์ด</div>`;
  return html`<div className="keyword-grid">${items.map(item=>html`<span key=${item.keyword} className=${'kw r-'+(item.risk_level||'contextual')}><span className="kw-term">${item.keyword}</span><span className="kw-meta">${riskMeta[item.risk_level]?.label||'บริบท'} • ${fmtN(item.count)}</span></span>`)}</div>`;
}

/* ===== MULTI-AI CONSENSUS CHART ===== */
function ChartMultiAI({multiAiStats}){
  const winsRef=useRef(null),winsChart=useRef(null);
  const scoresRef=useRef(null),scoresChart=useRef(null);
  const tokensRef=useRef(null),tokensChart=useRef(null);
  const ptRef=useRef(null),ptChart=useRef(null);

  const stats=multiAiStats||{};
  const summary=stats.summary||{};
  const wins=stats.provider_wins||[];
  const avgScores=stats.provider_avg_scores||[];
  const tokens=stats.provider_tokens||[];
  const times=stats.provider_response_times||[];
  const providerTimes=stats.provider_avg_times||[];
  const hasData=summary.total_evaluations>0;

  const COLORS=['#6366f1','#0ea5e9','#22c55e','#f97316','#ef4444','#8b5cf6','#ec4899','#14b8a6'];

  useEffect(()=>{
    if(!winsRef.current||!window.Chart||!wins.length)return;
    if(winsChart.current)winsChart.current.destroy();
    winsChart.current=new Chart(winsRef.current.getContext('2d'),{
      type:'doughnut',
      data:{labels:wins.map(w=>w.provider),datasets:[{data:wins.map(w=>w.wins),backgroundColor:wins.map((_,i)=>COLORS[i%COLORS.length]),borderWidth:0,hoverOffset:14}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,color:labelColor(),padding:12}},tooltip:{...tipStyle(),callbacks:{label(ctx){const w=wins[ctx.dataIndex];return w.provider+': '+w.wins+' wins ('+fmtP(w.pct)+')';}}}}}
    });
    return()=>{if(winsChart.current)winsChart.current.destroy()};
  },[wins]);

  useEffect(()=>{
    if(!scoresRef.current||!window.Chart||!avgScores.length)return;
    if(scoresChart.current)scoresChart.current.destroy();
    scoresChart.current=new Chart(scoresRef.current.getContext('2d'),{
      type:'bar',
      data:{labels:avgScores.map(s=>s.provider),datasets:[{label:'คะแนนเฉลี่ย',data:avgScores.map(s=>s.avg_score),backgroundColor:avgScores.map((_,i)=>COLORS[i%COLORS.length]),borderRadius:8,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',scales:{x:{beginAtZero:true,max:100,ticks:{color:tickColor()},grid:{color:gridColor()},title:{display:true,text:'คะแนน (0-100)',color:labelColor()}},y:{ticks:{color:tickColor()},grid:{display:false}}},plugins:{legend:{display:false},tooltip:{...tipStyle(),callbacks:{label(ctx){const s=avgScores[ctx.dataIndex];return s.provider+': '+s.avg_score+' ('+s.evaluations+' evals)'}}}}}
    });
    return()=>{if(scoresChart.current)scoresChart.current.destroy()};
  },[avgScores]);

  useEffect(()=>{
    if(!tokensRef.current||!window.Chart||!tokens.length)return;
    if(tokensChart.current)tokensChart.current.destroy();
    tokensChart.current=new Chart(tokensRef.current.getContext('2d'),{
      type:'bar',
      data:{labels:tokens.map(t=>t.provider),datasets:[
        {label:'Prompt Tokens',data:tokens.map(t=>t.total_prompt),backgroundColor:'rgba(99,102,241,.7)',borderRadius:4},
        {label:'Completion Tokens',data:tokens.map(t=>t.total_completion),backgroundColor:'rgba(14,165,233,.7)',borderRadius:4}
      ]},
      options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{color:tickColor()},grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{color:tickColor()},grid:{color:gridColor()},title:{display:true,text:'จำนวนโทเคน',color:labelColor()}}},plugins:{legend:{display:true,labels:{usePointStyle:true,color:labelColor()}},tooltip:{...tipStyle(),mode:'index'}}}
    });
    return()=>{if(tokensChart.current)tokensChart.current.destroy()};
  },[tokens]);

  useEffect(()=>{
    if(!ptRef.current||!window.Chart||!providerTimes.length)return;
    if(ptChart.current)ptChart.current.destroy();
    ptChart.current=new Chart(ptRef.current.getContext('2d'),{
      type:'bar',
      data:{labels:providerTimes.map(p=>p.provider),datasets:[
        {label:'Generation',data:providerTimes.map(p=>p.avg_gen_ms/1000),backgroundColor:'rgba(99,102,241,.75)',borderRadius:6,borderSkipped:false},
        {label:'Evaluation',data:providerTimes.map(p=>p.avg_eval_ms/1000),backgroundColor:'rgba(14,165,233,.75)',borderRadius:6,borderSkipped:false}
      ]},
      options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{color:tickColor()},grid:{display:false}},y:{beginAtZero:true,ticks:{color:tickColor(),callback:v=>v+'s'},grid:{color:gridColor()},title:{display:true,text:'เวลาเฉลี่ย (วินาที)',color:labelColor()}}},plugins:{legend:{display:true,labels:{usePointStyle:true,color:labelColor()}},tooltip:{...tipStyle(),mode:'index',callbacks:{afterBody(items){const i=items[0].dataIndex;const p=providerTimes[i];return'รวม: '+((p.avg_gen_ms+p.avg_eval_ms)/1000).toFixed(1)+'s (จาก '+p.gen_count+' gen, '+p.eval_count+' eval)'},label(ctx){return ctx.dataset.label+': '+(ctx.raw).toFixed(1)+'s'}}}}}
    });
    return()=>{if(ptChart.current)ptChart.current.destroy()};
  },[providerTimes]);

  if(!hasData)return html`<div className="empty">ยังไม่มีข้อมูล Multi-AI Consensus — เปิดใช้งาน MULTI_AI_ENABLED=true เพื่อเริ่มเก็บสถิติ</div>`;

  const genTime=times.find(t=>t.phase==='generation');
  const evalTime=times.find(t=>t.phase==='evaluation');

  return html`<div>

/* ===== VISUALIZATION PANEL (single large viz with tabs) ===== */
function VizPanel({activeTab,onTabChange,insights,multiAiStats}){
  const inf=insights?.infographic||{};
  const renderViz=()=>{
    switch(activeTab){
      case'trend':return html`<${ChartTrend} entries=${inf.message_trend||[]} />`;
      case'risk_trend':return html`<${ChartRiskTrend} entries=${insights?.risk_trend||[]} />`;
      case'risk_dist':return html`<${ChartRiskDist} riskSummary=${insights?.risk_summary||{}} />`;
      case'engagement':return html`<${ChartEngagement} engagement=${inf.engagement||{}} quality=${inf.quality||{}} />`;
      case'retention':return html`<${ChartRetention} buckets=${insights?.retention_buckets||[]} />`;
      case'depth':return html`<${ChartDepth} entries=${insights?.conversation_depth||[]} />`;
      case'keywords':return html`<${VizKeywords} keywords=${insights?.top_keywords||[]} />`;
      case'multi_ai':return html`<${ChartMultiAI} multiAiStats=${multiAiStats} />`;
      default:return null;
    }
  };
  return html`<section className="card viz">
    <div className="tabs">${TAB_KEYS.map(k=>html`<button key=${k} type="button" className=${'tab'+(activeTab===k?' on':'')} onClick=${()=>onTabChange(k)}>${TAB_LABELS[k]}</button>`)}</div>
    <div style=${{marginTop:'20px'}}>${renderViz()}</div>
    <div className="viz-desc"><strong>${TAB_LABELS[activeTab]}: </strong>${TAB_DESC[activeTab]}</div>
  </section>`;
}

/* ===== USER TABLE ===== */
function UserTable({users,onInspect,searchQuery,onSearchChange,usersMeta}){
  const[sf,setSf]=useState('total_messages');
  const[sd,setSd]=useState('desc');
  const handleSort=f=>{if(sf===f)setSd(sd==='asc'?'desc':'asc');else{setSf(f);setSd('desc')}};
  const filtered=useMemo(()=>{
    let items=Array.isArray(users)?[...users]:[];
    if(searchQuery?.trim()){const q=searchQuery.toLowerCase().trim();items=items.filter(u=>{const n=(u.display_name||u.alias||u.user_id||'').toLowerCase();return n.includes(q)||(u.user_id||'').toLowerCase().includes(q)})}
    items.sort((a,b)=>{let av=a[sf],bv=b[sf];if(sf==='last_interaction'){av=new Date(av).getTime();bv=new Date(bv).getTime()}else{av=Number(av)||0;bv=Number(bv)||0}return sd==='asc'?av-bv:bv-av});
    return items;
  },[users,searchQuery,sf,sd]);
  const totalAvailable=Number(usersMeta?.total)||((Array.isArray(users)&&users.length)||0);
  const shownCount=(Array.isArray(users)&&users.length)||0;
  const subtitle=searchQuery?.trim()?`${fmtN(filtered.length)} matches in current window`:`Showing ${fmtN(shownCount)} of ${fmtN(totalAvailable)} users in current window`;
  const si=f=>sf!==f?'sort':sd==='asc'?'asc':'desc';
  return html`<section className="card">
    <div className="card-head"><div><p className="eyebrow">ผู้ใช้ที่ต้องติดตาม</p><h3>ภาพรวมผู้ใช้รายบุคคล</h3></div><p className="card-subtitle" style=${{fontSize:'.82rem',color:'var(--text-muted)'}}>คลิกเพื่อดูรายละเอียด</p></div>
    <div className="search-box"><span>🔍</span><input type="search" placeholder="ค้นหาผู้ใช้..." value=${searchQuery} onChange=${e=>onSearchChange(e.target.value)} /></div>
    ${filtered.length===0?html`<div className="empty">${searchQuery?'ไม่พบผู้ใช้':'ยังไม่มีข้อมูลผู้ใช้'}</div>`:html`<div className="u-table">
      <div className="u-head"><span onClick=${()=>handleSort('user_id')}>ผู้ใช้ <span style=${{fontSize:'.7rem',opacity:.6}}>${si('user_id')}</span></span><span onClick=${()=>handleSort('total_messages')}>ข้อความ <span style=${{fontSize:'.7rem',opacity:.6}}>${si('total_messages')}</span></span><span onClick=${()=>handleSort('important_messages')}>สำคัญ <span style=${{fontSize:'.7rem',opacity:.6}}>${si('important_messages')}</span></span><span onClick=${()=>handleSort('important_ratio')}>สัดส่วน <span style=${{fontSize:'.7rem',opacity:.6}}>${si('important_ratio')}</span></span><span onClick=${()=>handleSort('last_interaction')}>ล่าสุด <span style=${{fontSize:'.7rem',opacity:.6}}>${si('last_interaction')}</span></span></div>
      <div className="u-body">${filtered.map(u=>{
        const name=u.display_name||u.alias||u.user_id;
        const hasHigh=Array.isArray(u.recent_risk_events)&&u.recent_risk_events.some(e=>e.risk_level==='high');
        const chipLbl=hasHigh?'เตือนสูง':u.recent_risk_events?.length?'แจ้งเตือน':null;
        return html`<button key=${u.user_id} type="button" className="u-row" onClick=${()=>onInspect(u.user_id)}>
          <span className="u-entry"><span className="u-avatar">${getInitials(name)}</span><span className="u-info"><strong>${name}</strong><span className="u-id">${u.user_id}</span></span></span>
          <span className="u-stat">${fmtN(u.total_messages)}</span><span className="u-stat">${fmtN(u.important_messages)}</span><span className="u-stat">${fmtP(u.important_ratio||0)}</span>
          <span className="u-meta"><span>${fmtDT(u.last_interaction)}</span>${chipLbl?html`<span className=${'r-chip '+(hasHigh?'high':'medium')}>${chipLbl}</span>`:null}</span>
        </button>`})}</div>
    </div>`}
  </section>`;
}

/* ===== USER MODAL ===== */
function UserModal({userId,detail,loading,error,onClose}){
  useEffect(()=>{if(userId)document.body.classList.add('modal-open');return()=>document.body.classList.remove('modal-open')},[userId]);
  if(!userId)return null;
  const s=detail?.summary||{};const hist=Array.isArray(detail?.history)?detail.history:[];
  const riskEv=Array.isArray(detail?.risk_events)?detail.risk_events.filter(e=>(e.risk_level||'general')!=='general'):[];
  return html`<div className="modal-bg" role="dialog" onClick=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="modal"><div className="modal-top"><div><p className="eyebrow">รายละเอียดผู้ใช้</p><h3>${s.display_name||s.user_id||'ไม่ทราบชื่อ'}</h3><p className="modal-sub">${s.user_id||userId}</p></div><button className="ghost-btn" onClick=${onClose}>✕</button></div>
    ${loading?html`<div style=${{padding:'40px',textAlign:'center',color:'var(--text-muted)'}}><${Spin} pri=${true} /><p style=${{marginTop:'12px'}}>กำลังโหลด...</p></div>`
    :error?html`<div className="empty" style=${{margin:'20px 28px'}}>${error}</div>`
    :html`<div className="modal-body">
      <section className="modal-section"><h4>สรุปภาพรวม</h4><div className="modal-grid"><div><span>ข้อความทั้งหมด</span><strong>${fmtN(s.total_messages)}</strong></div><div><span>สำคัญ</span><strong>${fmtN(s.important_messages)}</strong></div><div><span>สัดส่วน</span><strong>${fmtP(s.important_ratio||0)}</strong></div><div><span>โทเคน</span><strong>${fmtN(s.total_tokens)}</strong></div><div><span>ล่าสุด</span><strong>${fmtDT(s.last_interaction)}</strong></div><div><span>เริ่มต้น</span><strong>${fmtDT(s.first_interaction)}</strong></div></div></section>
      <section className="modal-section"><h4>เหตุการณ์ความเสี่ยง</h4>${riskEv.length===0?html`<div className="empty">ไม่มีเหตุการณ์ความเสี่ยง</div>`:html`<div className="risk-feed">${riskEv.map((ev,i)=>html`<div key=${i} className="risk-row"><span className=${'r-chip '+(ev.risk_level||'unknown')}>${riskMeta[ev.risk_level]?.label||'ไม่ระบุ'}</span><div className="risk-info"><strong>${fmtDT(ev.timestamp)}</strong><span>${ev.keywords?.length?ev.keywords.join(', '):'ไม่มีคีย์เวิร์ด'}</span></div></div>`)}</div>`}</section>
      <section className="modal-section"><h4>ประวัติการสนทนา</h4>${hist.length===0?html`<div className="empty">ไม่มีประวัติ</div>`:html`<ul className="timeline">${hist.map((it,i)=>html`<li key=${i} className=${'tl-item'+(it.important?' imp':'')}><div className="tl-meta"><span>${fmtDT(it.timestamp)}</span>${it.important?html`<span className="r-chip medium">สำคัญ</span>`:null}</div><div className="tl-msgs"><p><span className="tl-lbl">ผู้ใช้:</span> ${it.user_message||'-'}</p><p><span className="tl-lbl">ใจดี:</span> ${it.bot_response||'-'}</p></div></li>`)}</ul>`}</section>
    </div>`}
    </div></div>`;
}

  const fetchJson=useCallback(async(url,options={})=>{const res=await fetch(url,{...options,headers:buildHeaders(options.headers||{})});if(res.status===401){handleUnauthorized();const err=new Error('AUTH_REQUIRED');err.code='AUTH_REQUIRED';throw err}if(!res.ok){let payload=null;try{payload=await res.json()}catch{}throw new Error(payload?.message||payload?.error||('HTTP '+res.status))}setAuthError(null);return res.json()},[buildHeaders,handleUnauthorized]);

  useEffect(()=>{if(tab!=='multi_ai'){return}if(authRequired&&!authToken){setMultiAiStats(null);return}let a=true;
    (async()=>{try{const q=new URLSearchParams({lookback_days:params.lookbackDays});const d=await fetchJson('/api/dashboard/multi-ai-stats?'+q);if(a)setMultiAiStats(d)}catch(e){if(a&&e.message!=='AUTH_REQUIRED'){console.error('[multi-ai-stats]',e)}}})();
    return()=>{a=false};

    return()=>{a=false};

  useEffect(()=>{if(!selUser){setUserDetail(null);setUserErr(null);return}if(authRequired&&!authToken){setUserDetail(null);setUserErr('Dashboard access token required.');return}let a=true;setUserLoad(true);setUserErr(null);setUserDetail(null);

          ${[
            {k:'total',l:'บทสนทนาทั้งหมด',v:fmtN(ov.total_conversations),h:'ในช่วงที่เลือก',c:'#6366f1'},
            {k:'users',l:'ผู้ใช้',v:fmtN(ov.unique_users),h:'โต้ตอบกับระบบ',c:'#0ea5e9'},
            {k:'imp',l:'ข้อความสำคัญ',v:fmtN(ov.important_messages),h:fmtP(impShare),c:'#f97316'},
            {k:'fu',l:'ภารกิจติดตาม',v:fmtN(ov.active_follow_ups),h:'เคสที่ต้องดูแล',c:'#22c55e'},
            {k:'tok',l:'โทเคน/ข้อความ',v:fmtD(avgTok,2),h:'ความลึกบทสนทนา',c:'#8b5cf6'},
            {k:'deep',l:'ผู้ใช้เชิงลึก',v:fmtN(deepU),h:'โทเคน > 2,000',c:'#ef4444'}
          ].map(s=>html`<article key=${s.k} className="stat"><div className="stat-icon" style=${{backgroundColor:s.c+'20',color:s.c}}><span>●</span></div><div className="stat-body"><p className="stat-lbl">${s.l}</p><p className="stat-val">${s.v}</p><p className="stat-hint">${s.h}</p></div></article>`)}
        </section>

        <${VizPanel} activeTab=${tab} onTabChange=${setTab} insights=${insights} multiAiStats=${multiAiStats} />
        <${UserTable} users=${insights?.users||[]} usersMeta=${insights?.users_meta||{}} onInspect=${setSelUser} searchQuery=${search} onSearchChange=${setSearch} />
      `:null}
    </main>

    <${UserModal} userId=${selUser} detail=${userDetail} loading=${userLoad} error=${userErr} onClose=${()=>setSelUser(null)} />
  </div>`;
}

const root=document.getElementById('root');
if(root)ReactDOM.createRoot(root).render(html`<${App} />`);
})();
  </script>
  {% endraw %}
</body>
</html>
